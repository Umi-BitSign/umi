[Service]
ExecStart=
ExecStart=/opt/umi-observer/.venv/bin/python -m umi.observer \
  --listen-host ${UMI_OBSERVER_LISTEN_HOST} \
  --port ${UMI_OBSERVER_PORT} \
  --network ${UMI_OBSERVER_NETWORK} \
  --trusted-host ${UMI_OBSERVER_TRUSTED_HOST} \
  --cors-origin https://umi.vision \
  --cors-origin https://www.umi.vision \
  --bundle-feed-config=${UMI_OBSERVER_BUNDLE_FEED_CONFIG} \
  --pilot-feed-config ${UMI_OBSERVER_PILOT_FEED_CONFIG} \
  --bootstrap-service-feed-config /var/lib/umi-observer/bootstrap-service-feed/config.json \
  --fresh-for-seconds 24 \
  --maximum-stale-seconds 120 \
  --refresh-interval-seconds 12 \
  --refresh-timeout-seconds 45 \
  --finalized-head-timeout-seconds 20 \
  --maximum-finalized-head-age-seconds 120 \
  --maximum-future-block-skew-seconds 30 \
  --log-level info
ReadOnlyPaths=/var/lib/umi-observer/pilot-feed /var/lib/umi-observer/pilots /var/lib/umi-observer/bootstrap-service-feed /var/lib/umi-observer/bootstrap-service-publications
