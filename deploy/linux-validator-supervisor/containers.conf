# Loaded after the host's normal containers.conf files. The supervisor runs as
# a system account without a login session, so rootless Podman must manage the
# delegated subtree directly instead of depending on a user systemd/DBus
# session. The outer systemd unit still owns and limits the service cgroup.
[engine]
cgroup_manager = "cgroupfs"

# The UMI worker does not require any default sysctls. Disabling them keeps
# rootless Podman compatible with hosts that make /proc/sys read-only.
[containers]
default_sysctls = []
