# Loaded after the host's normal containers.conf files. The supervisor runs as
# a system account without a login session. Workers disable Podman's nested
# cgroup management and inherit the fixed outer systemd service envelope; the
# cgroupfs selection therefore avoids a user systemd/DBus session dependency.
[engine]
cgroup_manager = "cgroupfs"
runtime = "crun"

# The UMI worker does not require any default sysctls. Disabling them keeps
# rootless Podman compatible with hosts that make /proc/sys read-only.
[containers]
default_sysctls = []
