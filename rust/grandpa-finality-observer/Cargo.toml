[package]
name = "umi-grandpa-finality-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[dependencies]
blake2 = "=0.10.6"
futures-util = "=0.3.31"
hex = "=0.4.3"
log = "=0.4.34"
serde = { version = "=1.0.228", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"
smoldot = { version = "=2.2.0", default-features = false, features = ["std"] }
subxt-lightclient = { version = "=0.50.3", default-features = false, features = ["native"] }
thiserror = "=2.0.17"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
sha2 = "=0.10.9"

[patch.crates-io]
smoldot = { path = "vendor/smoldot-2.2.0" }
smoldot-light = { path = "vendor/smoldot-light-1.3.2" }
subxt-lightclient = { path = "vendor/subxt-lightclient-0.50.3" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
