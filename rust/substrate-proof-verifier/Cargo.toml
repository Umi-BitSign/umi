[package]
name = "umi-substrate-proof-verifier"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sp-core = { git = "https://github.com/RaoFoundation/polkadot-sdk.git", rev = "cacb4310f20c7cac83eb3ccd8ed5a5ad4212608a", default-features = false }
sp-trie = { git = "https://github.com/RaoFoundation/polkadot-sdk.git", rev = "cacb4310f20c7cac83eb3ccd8ed5a5ad4212608a", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
