name: Validator installation or operation
description: Report a validator installation problem or a held weight worker.
title: "[Validator] "
body:
  - type: markdown
    attributes:
      value: |
        Follow the [validator guide](https://github.com/Umi-BitSign/umi/blob/main/docs/PERMANENT_VALIDATOR_SUPERVISOR.md).
        Calibration enrollment is closed. Do not attach wallet files, seed phrases, keys, passwords, private paths or full journals.
  - type: input
    id: hotkey
    attributes:
      label: Public validator hotkey
      description: Public SN78 SS58 hotkey; add the current UID if known.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Bounded status and reason code
      description: Include the accepted release sequence, worker reason code and finalized block if known. Exclude credentials and full journals.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: State whether this is a fresh installation or an existing service, and what changed before the problem.
    validations:
      required: true
