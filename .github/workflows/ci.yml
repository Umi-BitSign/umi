name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.9
          uv lock --check
          uv export --locked --no-dev --no-hashes --no-emit-project \
            | uv tool run --from pip-audit==2.10.1 pip-audit -r /dev/stdin

      - name: Install pinned Rust audit tool
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 install cargo-audit --locked --version 0.22.2

      - name: Audit locked Rust dependencies
        run: |
          cargo +1.98.0 audit --file rust/substrate-proof-verifier/Cargo.lock
          cargo +1.98.0 audit --file rust/grandpa-finality-observer/Cargo.lock

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.9
          uv lock --check
          uv sync --locked --extra dev

      - name: Check pinned Bittensor CLI startup
        run: .venv/bin/btcli --version

      - name: Check installed dependency compatibility
        run: uv pip check --python .venv/bin/python

      - name: Lint
        run: uv run --locked ruff check src tests neurons

      - name: Check formatting
        run: uv run --locked ruff format --check src tests neurons

      - name: Test
        run: uv run --locked pytest

      - name: Build wheel
        run: |
          uv build --wheel --out-dir dist
          uv pip install --python .venv/bin/python --force-reinstall --no-deps dist/*.whl

      - name: Check console entry points
        run: |
          .venv/bin/umi-component-pilot --help
          .venv/bin/umi-demo --help
          .venv/bin/umi-miner --help
          .venv/bin/umi-miner-finality-artifact --help
          .venv/bin/umi-mirror-service --help
          .venv/bin/umi-observer --help
          .venv/bin/umi-publisher-batch --help
          .venv/bin/umi-publisher-availability --help
          .venv/bin/umi-publisher-pool-anchor --help
          .venv/bin/umi-public-pilot --help
          .venv/bin/umi-public-pilot-miner --help
          .venv/bin/umi-protocol --help
          .venv/bin/umi-shadow-release --help
          .venv/bin/umi-shadow-release-finalize --help
          .venv/bin/umi-shadow-release-materialize-operator --help
          .venv/bin/umi-shadow-release-resolve-miner --help
          .venv/bin/umi-shadow-release-verify --help
          .venv/bin/umi-validator --help
          .venv/bin/umi-validator-audit-publish --help
          .venv/bin/umi-validator-live --help
          .venv/bin/umi-validator-live-configure --help
          .venv/bin/umi-validator-live-reconcile --help

  substrate-proof-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/substrate-proof-verifier

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --locked

      - name: Build release verifier
        run: cargo +1.98.0 build --locked --release

  grandpa-finality-observer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/grandpa-finality-observer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --locked

      - name: Build release observer
        run: cargo +1.98.0 build --locked --release

  macos-miner:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install pinned toolchains and project
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.9
          uv lock --check
          uv sync --locked --extra dev
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Test and build native finality observer
        run: |
          cargo +1.98.0 fmt --manifest-path rust/grandpa-finality-observer/Cargo.toml -- --check
          cargo +1.98.0 clippy --locked --all-targets \
            --manifest-path rust/grandpa-finality-observer/Cargo.toml -- -D warnings
          cargo +1.98.0 test --locked \
            --manifest-path rust/grandpa-finality-observer/Cargo.toml
          cargo +1.98.0 build --locked --release \
            --manifest-path rust/grandpa-finality-observer/Cargo.toml
          cargo +1.98.0 clean \
            --manifest-path rust/grandpa-finality-observer/Cargo.toml \
            --profile test
          test -x rust/grandpa-finality-observer/target/release/umi-grandpa-finality-observer

      - name: Seal and verify the native miner finality artifact
        run: |
          git worktree add --detach "$RUNNER_TEMP/umi-artifact-source" HEAD
          ARTIFACT_PARENT="$GITHUB_WORKSPACE/target/ci-native-artifact"
          ARTIFACT_DIR="$ARTIFACT_PARENT/umi-darwin-finality"
          install -d -m 0700 "$ARTIFACT_PARENT"
          chmod -RN "$ARTIFACT_PARENT"
          .venv/bin/umi-miner-finality-artifact \
            --repository-root "$RUNNER_TEMP/umi-artifact-source" \
            --binary "$GITHUB_WORKSPACE/rust/grandpa-finality-observer/target/release/umi-grandpa-finality-observer" \
            --output-dir "$ARTIFACT_DIR"
          test -x "$ARTIFACT_DIR/umi-grandpa-finality-observer"
          "$ARTIFACT_DIR/umi-grandpa-finality-observer" \
            --conformance-self-test

      - name: Test macOS miner runtime boundaries
        env:
          UMI_TEST_NATIVE_DARWIN_FINALITY_ARTIFACT_DIR: ${{ github.workspace }}/target/ci-native-artifact/umi-darwin-finality
        run: |
          uv run --locked pytest -q \
            tests/test_grandpa_finality.py \
            tests/test_grandpa_finality_supervisor.py \
            tests/test_miner_admission.py \
            tests/test_miner_resources.py \
            tests/test_miner_transport.py \
            tests/test_model_scheduler.py
          uv run --locked pytest -q \
            tests/test_shadow_release.py::test_signed_release_can_add_a_native_darwin_miner_finality_target
          .venv/bin/umi-miner --help
          .venv/bin/umi-miner-finality-artifact --help
          .venv/bin/umi-public-pilot --help
          .venv/bin/umi-public-pilot-miner --help
          .venv/bin/umi-shadow-release-resolve-miner --help

  macos-validator-container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the revision-bound Linux validator runtime used on Apple Silicon
        run: |
          UMI_IMAGE="umi-validator:${GITHUB_SHA}"
          docker build --pull --platform linux/amd64 \
            --build-arg "UMI_GIT_REVISION=${GITHUB_SHA}" \
            --file deploy/macos-validator/Dockerfile \
            --tag "$UMI_IMAGE" \
            .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$UMI_IMAGE")" = "$GITHUB_SHA"

      - name: Check the bounded container without mounting a wallet or release
        run: |
          UMI_IMAGE="umi-validator:${GITHUB_SHA}"
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 1g \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777 \
            "$UMI_IMAGE" version | tee /tmp/umi-validator-version.txt
          grep -Fx "umi_git_revision=${GITHUB_SHA}" /tmp/umi-validator-version.txt
          grep -Fx 'machine=x86_64' /tmp/umi-validator-version.txt
          grep -Fx 'kernel=Linux' /tmp/umi-validator-version.txt
          grep -Fx 'validator_entrypoints_ready=1' /tmp/umi-validator-version.txt

      - name: Smoke-test persistent volumes and the loopback audit origin
        run: |
          export UMI_HOST_UID="$(id -u)"
          export UMI_HOST_GID="$(id -g)"
          export UMI_GIT_REVISION="${GITHUB_SHA}"
          export UMI_DEPLOYMENT_ID="ci-${GITHUB_SHA}"
          export UMI_VALIDATOR_IMAGE="umi-validator:${GITHUB_SHA}"
          export UMI_RELEASE_ROOT=/tmp/umi-release
          export UMI_OPERATOR_INPUT_ROOT=/tmp/umi-operator-input
          export UMI_WALLET_ROOT=/tmp/umi-wallets
          export UMI_AUDIT_PUBLISHER_INPUT_ROOT=/tmp/umi-publisher-input
          export UMI_EXPECTED_AUTHORITY_HOTKEY=5ExpectedAuthority
          export UMI_VALIDATOR_HOTKEY=5ExpectedValidator
          export UMI_VALIDATOR_ACCOUNT_HEX=2222222222222222222222222222222222222222222222222222222222222222
          export UMI_AUDIT_ORIGIN_PORT=18093
          mkdir -p \
            "$UMI_RELEASE_ROOT" \
            "$UMI_OPERATOR_INPUT_ROOT" \
            "$UMI_WALLET_ROOT" \
            "$UMI_AUDIT_PUBLISHER_INPUT_ROOT"
          docker compose --file deploy/macos-validator/compose.yaml config --quiet
          docker compose --file deploy/macos-validator/compose.yaml \
            run --rm --no-deps volume-init init-volumes
          docker compose --file deploy/macos-validator/compose.yaml \
            build --pull audit-origin
          trap 'docker compose --file deploy/macos-validator/compose.yaml stop audit-origin' EXIT
          docker compose --file deploy/macos-validator/compose.yaml \
            up --detach --no-deps --no-build --pull never audit-origin
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${UMI_AUDIT_ORIGIN_PORT}/not-a-public-route" || true)"
            [ "$status" = 404 ] && break
            sleep 1
          done
          test "$status" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "http://127.0.0.1:${UMI_AUDIT_ORIGIN_PORT}/not-a-public-route")" = 405

  executable-conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          rustup toolchain install 1.98.0 --profile minimal

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.9
          uv lock --check
          uv sync --locked --extra dev

      - name: Build pinned release executables
        run: |
          cargo +1.98.0 build --locked --release \
            --manifest-path rust/substrate-proof-verifier/Cargo.toml
          cargo +1.98.0 build --locked --release \
            --manifest-path rust/grandpa-finality-observer/Cargo.toml

      - name: Execute all conformance fixtures
        run: uv run --locked pytest -q tests/test_conformance.py
